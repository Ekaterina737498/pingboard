services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pingboard
      POSTGRES_PASSWORD: pingboard
      POSTGRES_DB: pingboard
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pingboard"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres_data: