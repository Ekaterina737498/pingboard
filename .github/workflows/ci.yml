name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pingboard
          POSTGRES_PASSWORD: pingboard
          POSTGRES_DB: pingboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pingboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        redis:
          image: redis:7
          ports:
            - 6379:6379
          options: >-
            --health-cmd "redis-cli ping"
            --health-interval 5s
            --health-timeout 5s
            --health-retries 10  
    env:
      DATABASE_URL: postgresql://pingboard:pingboard@localhost:5432/pingboard_test
      TEST_DATABASE_URL: postgresql://pingboard:pingboard@localhost:5432/pingboard_test
      JWT_ACCESS_SECRET: ci-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run build
      - run: npm run test
      - run: npm run test:e2e

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
